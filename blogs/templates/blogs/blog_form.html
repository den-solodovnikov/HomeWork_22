{% extends 'catalog/base.html' %}

{% block title %}SkyMarket{% endblock %}

{% block content %}

{% include 'catalog/title.html' %}

<div class="pricing-header px-3 py-3 pt-md-5 pb-md-4 mx-auto text-center">
    <h2 class="display-4">Создаем новую запись</h2>
    <a href="{% url 'blogs:blog' %}" class="btn btn-outline-secondary mb-3">← Назад к списку записей</a>
</div>

<div class="container">
    <div class="row text-center">
        <div class="col-4">
            <form method="post" class="row" enctype="multipart/form-data">
                <div class="card">
                    <div class="card-body">
                        {% csrf_token %}
                        {{ form.as_p}}
                    </div>
                    <button type="submit" class="btn btn-lg btn-block btn-outline-primary">
                        {% if blog %}
                        Сохранить
                        {% else %}
                        Создать
                        {% endif %}
                    </button>
                    <a class="btn btn-lg btn-block btn-outline-primary" href="{% url 'blogs:blog' %}" role="button">Отмена</a>
                </div>
            </form>
        </div>
    </div>
</div>

{% endblock %}
