{% extends 'base.html' %}

{% block tittle %}SkyMarket{% endblock %}

{% block content %}

{% include 'title.html' %}
<div class="container">
    <div class="row text-center">

            {% for product in products|slice:":100" %}
            <div class="col-3">
                <div class="card mb-4 box-shadow w-100">
                    <div class="card-header text-truncate w-100">
                        <h4 class="my-0 font-weight-normal">{{ product.name | truncatechars:100 }}</h4>
                    </div>
                    <div class="card-body">
                        <h1 class="card-title pricing-card-title">{{ product.price }}</h1>
                        <p>{{ product.description | truncatechars:25 }}</p>
                        <a href="{% url 'catalog:products' product.pk %}">
                            <button type="button" class="btn btn-lg btn-block btn-outline-primary">Открыть</button>
                        </a>
                    </div>
                </div>
            </div>
            {% endfor %}
    </div>
</div>

{% endblock %}
