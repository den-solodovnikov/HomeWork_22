{% extends 'catalog/base.html' %}

{% block title %}SkyMarket{% endblock %}

{% block content %}

{% include 'catalog/title.html' %}

<div class="container">
    <a href="{% url 'catalog:home' %}" class="btn btn-outline-secondary mb-3">← Назад к списку товаров</a>
    <div class="row text-center">
        <div class="col-4 mx-auto h-100">
            <div class="card mb-4 box-shadow">
                <div class="card-header">
                    <h4 class="my-0 font-weight-normal">{{ product.name }}</h4>
                    {% if product.image %}
                    <img src="{{ product.image.url }}" class="card-img-top" alt="{{ product.name }}">
                    {% else %}
                    <img src=# class="card-img-top" alt="Image is missing">
                    {% endif %}
                </div>
                <div class="card-body">
                    <h1 class="card-title pricing-card-title">{{ product.price }}</h1>

                    <button type="button" class="btn btn-lg btn-block btn-outline-primary">Купить</button>
                </div>
            </div>
        </div>
        <div class="col-8 mx-auto">
            <div class="card mb-4 box-shadow">
                <div class="card-header">
                    <h4 class="my-0 font-weight-normal">Описание</h4>
                </div>
                <div class="card-body">
                    <p>{{ product.description }}</p>
                </div>
            </div>
        </div>

    </div>
</div>

{% endblock %}
