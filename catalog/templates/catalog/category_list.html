{% extends 'catalog/base.html' %}

{% block title %}SkyMarket{% endblock %}

{% block content %}

{% include 'catalog/title.html' %}

<div class="pricing-header px-3 py-3 pt-md-5 pb-md-4 mx-auto text-center">
    <h2 class="display-4">Выбор категории</h2>
    <a href="{% url 'catalog:home' %}" class="btn btn-outline-secondary mb-3">← Назад к списку товаров</a>
</div>

<div class="container">
    <div class="row text-center">
        <div class="col-4">
            <form method="post" class="row" enctype="multipart/form-data">
                <div class="card">
                    <div class="card-body">
                        {% csrf_token %}
                        {{ form.as_p}}
                    </div>
                   <ul>
                       {% for category in categories %}
                       <a class="btn btn-primary" href="{% url 'catalog:products_by_category' category.id %}">{{ category.name }}</a>
                       {% endfor %}
                   </ul>
                </div>
            </form>
        </div>
    </div>
</div>

{% endblock %}
